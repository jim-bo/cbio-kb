name: test

# Unit tests plus the wiki's structural lint and a crosslink dry run, on every
# push to main and every pull request. Deploys nothing; the deployables have
# their own workflows (website.yml, chat-api.yml, mcp-server.yml; see
# docs/hosting.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      # `--extra chat` pulls the retrieval stack (rank-bm25, FAISS, ONNX
      # Runtime) so the hybrid retrieval tests actually run, and `--extra
      # server` pulls fastmcp plus the index-building deps (PyTorch
      # sentence-transformers, spaCy) for the MCP server and index tests. Without them those tests self-skip via
      # importorskip and CI reports a false green.
      - run: uv sync --group dev --extra chat --extra server
      - run: uv run pytest -v
      - run: uv run cbio-kb lint --wiki-dir wiki --allow-orphans
      - run: uv run cbio-kb crosslink --dry-run --wiki-dir wiki
