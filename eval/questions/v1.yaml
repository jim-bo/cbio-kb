  # Added 2026-06-07 (full-corpus refresh): D11–D18 grounded in newly-eligible papers.
  - id: D11
    category: definition
    split: train
    question: >
      What is MiMSI, and how does it detect microsatellite instability from MSK-IMPACT
      sequencing?
    gold_pmids: [39746944]
    gold_entities: [mimsi]
    notes: >
      Deep multiple-instance-learning classifier detecting MSI from targeted NGS reads at
      microsatellite loci. Trained on 741 MSK-IMPACT cases; sensitivity 0.895 / auROC 0.971
      (vs MSISensor 0.67 / 0.907), largest gain in <30% purity; cut indeterminate rate 3.8%→0.47% across 45,112 tumors.

  - id: D12
    category: definition
    split: train
    question: >
      What is MSK-ACCESS (the ACCESS129 assay), and how does paired normal sequencing
      improve cfDNA mutation calling?
    gold_pmids: [34145282]
    gold_entities: [msk-access]
    notes: >
      129-gene hybrid-capture cfDNA NGS assay (~20,000x raw / ~1,100x duplex) paired with matched WBC
      sequencing. 92% de novo sensitivity at ≥0.5% VAF, ≥99.7% specificity; matched WBC removed >10,000
      germline/CH variants plasma-only filtering would miss.

  - id: D13
    category: definition
    split: train
    question: >
      What is the high-intensity cfDNA + matched-WBC sequencing approach of Razavi et al.,
      and what did it reveal about the sources of plasma cell-free DNA variants?
    gold_pmids: [31768066]
    gold_entities: [grail_cfdna_508]
    notes: >
      508-gene / ~2 Mb >60,000X plasma assay with matched WBC DNA (124 cancer patients + 47 controls).
      Most "somatic" cfDNA variants are clonal hematopoiesis (81.6% controls / 53.2% cancer) detectable
      only with matched WBC — joint cfDNA+WBC sequencing needed to avoid mis-calling CH as tumor-derived.

  - id: D14
    category: definition
    split: train
    question: >
      What is the GLASS Consortium diffuse-glioma cohort, and what did its longitudinal
      analysis establish about glioma evolution?
    gold_pmids: [31748746]
    gold_entities: [difg_glass_2019]
    notes: >
      Glioma Longitudinal AnalySiS: temporally separated DNA sequencing from 222 adult diffuse-glioma
      patients (IDH-mut codel / non-codel / IDH-WT) at diagnosis + recurrence. Diagnosis drivers almost
      universally retained at recurrence; alkylator therapy drove subtype-dependent hypermutation; strongest selection acts early.

  - id: D15
    category: definition
    split: val
    question: >
      What is the tumor mutational burden (TMB) survival biomarker defined by Samstein
      et al., and how does it predict outcome after immune checkpoint blockade?
    gold_pmids: [30643254]
    gold_entities: [tmb_mskcc_2018]
    notes: >
      Using MSK-IMPACT data for 1,662 ICI-treated + 5,371 non-ICI patients, TMB ("high" = top 20% within
      histology) predicted better OS after ICI (HR 0.52; p=1.6e-6) across most histologies (not glioma);
      cutpoint varied markedly by cancer type, arguing against a single universal threshold.

  - id: D16
    category: definition
    split: val
    question: >
      What is the MSK prostate-cancer-by-self-reported-race genomic cohort (Stopsack et
      al.), and what genomic differences did it characterize, including the role of chr8q gain?
    gold_pmids: [34667026]
    gold_entities: [prad_msk_stopsack_2021]
    notes: >
      MSK-IMPACT cohort of 2,069 men (1,841 White, 165 Black, 63 Asian) characterizing somatic
      differences by self-reported race. Black men: more AR alterations + chr8q gains, fewer PTEN/TP53;
      Asian men: enriched class-1 FOXA1/ZFHX3. Area-level income independently associated with chr8q gain (not purely germline).

  - id: D17
    category: definition
    split: test
    question: >
      What is the Gounder et al. comprehensive sarcoma genomic profiling cohort
      (sarcoma_msk_2022), and what did profiling 7,494 sarcomas reveal about actionability?
    gold_pmids: [35705558]
    gold_entities: [sarcoma_msk_2022]
    notes: >
      7,494 soft-tissue/bone sarcomas across 44 histologies profiled by FoundationOne Heme (465-gene DNA
      + 333-gene fusion panel), 2012–2018. Diagnostic refinement in 10.5%; 31.7% OncoKB-actionable; 2.6%
      kinase fusions; 3.9% TMB≥10; MSI-H rare (<0.3%); 15% high gLOH.

  - id: D18
    category: definition
    split: test
    question: >
      What is HRDetect, and how was it used to assess homologous-recombination deficiency
      in the Sherlock-Lung never-smoker cohort?
    gold_pmids: [34493867]
    gold_entities: [hrdetect]
    notes: >
      ML classifier combining six mutational-signature features (SBS3, SBS8, microhomology deletions, SV
      signatures, indel enrichment, large deletions) → HRD probability (>0.7 = HRD-positive). In Sherlock-Lung
      WGS of 232 never-smoker lung cancers, ~16% (n=37) scored >0.7, concentrated in forte/mezzo-forte SCNA subtypes.
