name: MCP server image

# The MCP server container, docker/mcp.Dockerfile (one of three deployables;
# see docs/hosting.md).
#
#   pull requests  build only, nothing pushed
#   main           ghcr.io/<owner>/cbio-kb-mcp:main and :sha-<short>
#   v* tags        :<version>, :<major>.<minor>, :latest and :sha-<short>;
#                  also <DOCKER_USERNAME>/cbio-kb on Docker Hub, but only if
#                  the DOCKER_USERNAME and DOCKER_PASSWORD secrets exist
#                  (skipped otherwise)
#
# GHCR is pushed with the built-in GITHUB_TOKEN; no registry secrets needed.
# The image bakes in the wiki markdown, so wiki content changes rebuild it.
#
# Optional repository variables:
#   PAPER_INDEX_URL, PAPER_INDEX_SHA256  bake a passage-index tarball from
#       scripts/package_index.sh into the image. Unset: no index in the
#       image; mount one at /app/data/paper_index instead.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "ai_search/**"
      - "src/**"
      - "wiki/**.md"
      - "wiki/graph.json"
      - "data/seed/**"
      - "schema/ontology/**"
      - "pyproject.toml"
      - "uv.lock"
      - "docker/mcp.Dockerfile"
      - "docker/fetch_paper_index.py"
      - ".dockerignore"
      - ".github/workflows/mcp-server.yml"
  pull_request:
    paths:
      - "ai_search/**"
      - "src/**"
      - "wiki/**.md"
      - "wiki/graph.json"
      - "data/seed/**"
      - "schema/ontology/**"
      - "pyproject.toml"
      - "uv.lock"
      - "docker/mcp.Dockerfile"
      - "docker/fetch_paper_index.py"
      - ".dockerignore"
      - ".github/workflows/mcp-server.yml"
  workflow_dispatch:

concurrency:
  group: mcp-server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build (push unless PR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to GHCR with GITHUB_TOKEN
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image names
        id: names
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          # Registry paths must be lowercase; the owner name may not be.
          echo "ghcr=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cbio-kb-mcp" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_REF" == refs/tags/v* && -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]]; then
              echo "dockerhub=${DOCKER_USERNAME,,}/cbio-kb" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Free runner disk space
        # Precaution: the builder stage holds the dependencies and model
        # weights before the slim runtime stage copies them out.
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.names.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.names.outputs.dockerhub != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # The Docker Hub line is empty (and ignored) unless it applies.
          images: |
            ${{ steps.names.outputs.ghcr }}
            ${{ steps.names.outputs.dockerhub }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mcp.Dockerfile
          push: ${{ steps.names.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PAPER_INDEX_URL=${{ vars.PAPER_INDEX_URL }}
            PAPER_INDEX_SHA256=${{ vars.PAPER_INDEX_SHA256 }}

      # Provenance attestations need a public repository (or GitHub Enterprise
      # Cloud for private ones); don't fail the build over them.
      - name: Attest (GHCR)
        if: steps.names.outputs.push == 'true'
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.names.outputs.ghcr }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest (Docker Hub)
        if: steps.names.outputs.dockerhub != ''
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/${{ steps.names.outputs.dockerhub }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
