  # Added 2026-06-07 (full-corpus refresh): S16–S25 grounded in newly-eligible papers.
  - id: S16
    category: synthesis
    split: train
    question: >
      Across the corpus's cell-free DNA assay-development papers, what shared rationale
      emerges for sequencing matched white-blood-cell DNA alongside plasma, and what
      fraction of "somatic" cfDNA calls turn out to be clonal hematopoiesis?
    gold_pmids: [31768066, 34145282, 33106634]
    gold_entities: [DNMT3A, TET2, PPM1D, TP53, CHEK2]
    notes: >
      All three converge: most cfDNA "somatic" variants are CH and require matched WBC
      sequencing to filter (31768066: 81.6% control / 53.2% cancer; 34145282 removes
      >10,000 germline/CH variants; 33106634 supplies the therapy-selected DDR-gene CH mechanism).

  - id: S17
    category: synthesis
    split: train
    question: >
      Across the prostate-cancer papers in the corpus, what do they agree on regarding
      the prevalence of DNA-damage-repair / homologous-recombination gene alterations and
      the rationale for PARP inhibition, and where do the reported rates and contexts differ?
    gold_pmids: [28825054, 26000489, 31061129, 35504881, 41071892]
    gold_entities: [BRCA2, BRCA1, ATM, CHEK2, PRAD]
    notes: >
      Agreement: DDR/HRR defects (BRCA2/BRCA1/ATM) recur in advanced PRAD and motivate PARPi.
      Differs in rate/context: 27% (28825054) vs 19.3% (26000489) vs PROfound-eligible 19.6% /
      9.8% BRCA1/2 in brain mets (35504881); 41071892 extends BRCAness to BRCA-WT; 31061129 ties RB1 (not HRR) to ARSI outcome.

  - id: S18
    category: synthesis
    split: train
    question: >
      How do the corpus's cholangiocarcinoma genomics papers agree and differ on the
      actionable driver landscape (IDH1/2, FGFR2) versus the genomic features that carry
      adverse prognosis?
    gold_pmids: [29848569, 28667006, 33765338, 31130341]
    gold_entities: [IDH1, FGFR2, KRAS, TP53, CDKN2A, CHOL]
    notes: >
      Agreement: IDH1/2 and FGFR2 fusions are recurrent actionable iCCA drivers; prognosis is
      driven instead by TP53/KRAS/CDKN2A. Differ: MSK-IMPACT prognostic cohorts (29848569, 33765338)
      vs etiology-driven subtypes (28667006) vs mixed HCC-ICC entity (31130341).

  - id: S19
    category: synthesis
    split: train
    question: >
      Across the head-and-neck squamous-cell-carcinoma papers in the corpus, what
      consistent picture emerges of the HPV-positive versus HPV-negative genomic
      dichotomy, and how does the recurrent/metastatic setting complicate it?
    gold_pmids: [25631445, 21798893, 23619168, 27442865]
    gold_entities: [TP53, CDKN2A, PIK3CA, NOTCH1, HNSC]
    notes: >
      Agreement: HPV-negative HNSC = TP53 loss + CDKN2A inactivation + smoking signature;
      HPV-positive = PIK3CA + lower mutation rate; NOTCH1 recurrent. 27442865 adds that
      recurrent/metastatic HPV-positive tumors acquire an HPV-negative-like TP53-mutant genotype.

  - id: S20
    category: synthesis
    split: train
    question: >
      Across the PD-1/PD-L1 blockade biomarker papers in the corpus, where do tumor
      mutational burden, PD-L1 expression, MSI, and transcriptional resistance programs
      agree as predictors of response, and where do they disagree?
    gold_pmids: [29337640, 30643254, 26997480, 29033130, 29850653]
    gold_entities: [CD274, PDCD1, STK11, BRCA2]
    notes: >
      Agreement: high TMB favors benefit (29337640, 30643254). Disagree/limits: bulk load does not
      separate melanoma responders (26997480 IPRES); clonal-load predicts in ipi-naive not ipi-progressed
      (29033130); no universal TMB cutpoint, no glioma benefit (30643254); MSI complementary (29850653).

  - id: S21
    category: synthesis
    split: train
    question: >
      Across the corpus's large clinical sarcoma sequencing studies, what common
      conclusions emerge about actionable-alteration yield and the dominance of
      copy-number-driven biology, and how do their cohorts and panels differ?
    gold_pmids: [35705558, 35705560, 29100075]
    gold_entities: [TP53, ALK, BRAF, NTRK1]
    notes: >
      Agreement: sarcomas are largely copy-number / TP53-cell-cycle driven with low TMB, yet ~30%
      carry an OncoKB-actionable alteration. Differ by cohort/panel: FoundationOne 7,494 (35705558)
      vs MSK-IMPACT 2,138 (35705560) vs TCGA 206 multi-omic SCNA-focused (29100075).

  - id: S22
    category: synthesis
    split: val
    question: >
      How does the corpus characterize prostate-cancer progression as an evolutionary
      trajectory from primary disease through metastatic castration-resistant disease to
      neuroendocrine transformation, and which genomic events mark each transition?
    gold_pmids: [26544944, 23622249, 26000489, 26855148, 28825054]
    gold_entities: [AR, TP53, RB1, PTEN, ERG, PRAD]
    notes: >
      Trajectory: ERG-fusion/SPOP primary subtypes (26544944) → punctuated chromoplexy ordering
      NKX3-1→TP53→PTEN (23622249) → early clonal TP53/somatic-BRCA2 (28825054) → AR/TP53/PTEN-enriched
      mCRPC (26000489) → RB1+TP53 loss / AR-depleted divergent NEPC (26855148).

  - id: S23
    category: synthesis
    split: val
    question: >
      Across the glioma papers in the corpus, what consistent role do CDKN2A loss, IDH
      status, and temozolomide-induced hypermutation play in malignant progression and
      recurrence, and how do tissue versus CSF liquid-biopsy approaches complement each other?
    gold_pmids: [31263031, 35649412, 30675060]
    gold_entities: [IDH1, CDKN2A, MGMT, TP53, ATRX]
    notes: >
      Agreement: CDKN2A loss is an IDH-status-independent progression driver (31263031, 35649412);
      TMZ-induced hypermutation marks recurrence. Complementarity: CSF ctDNA recapitulates truncal
      IDH1/TP53/ATRX/TERT and predicts death (30675060).

  - id: S24
    category: synthesis
    split: test
    question: >
      Across the corpus's GI-cancer papers, what differing roles does KRAS play — as a
      prognostic dosage biomarker, a side-specific driver, and a source of acquired
      resistance — and where do the findings converge?
    gold_pmids: [39753968, 29316426, 36355783]
    gold_entities: [KRAS, BRAF, EGFR, APC]
    notes: >
      Three KRAS angles converging on copy/dosage state as driver: PDAC mutant-allele dosage → worse OS
      (39753968); right-sided MSS mCRC enrichment → shorter survival (29316426); KRASG12C amplification
      as acquired resistance to G12C+EGFR blockade (36355783).

  - id: S25
    category: synthesis
    split: test
    question: >
      Across the corpus's cfDNA/ctDNA clinical studies, what common utilities of plasma
      and CSF liquid biopsy emerge, and how do the approaches differ by the clinical
      question and the confounders they must control for?
    gold_pmids: [34059130, 34145282, 31768066, 30675060, 32633890]
    gold_entities: [TP53, DNMT3A, PPM1D]
    notes: >
      Shared utility: detect tumor-derived alterations + track burden. Differ: tumor-fraction-guided
      plasma (34059130); clinical-grade actionability + CH/germline removal (34145282); CH dominates
      plasma variants (31768066); CSF reservoir for glioma (30675060); vitreous/plasma where biopsy contraindicated (32633890).

