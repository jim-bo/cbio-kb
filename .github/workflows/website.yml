name: Website

# The static Quarto site rendered from wiki/ (one of three deployables; see
# docs/hosting.md).
#
# Runs only when something the site is built from changes. Every run renders
# the site and uploads it as the "site" artifact, so it can be hosted
# anywhere. On main it is also published to GitHub Pages via the gh-pages
# branch.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables),
# all optional:
#   CHAT_API_URL      Chat API endpoint the /ask page posts to, e.g.
#                     https://chat.example.org/api/chat. Written into
#                     wiki/ask-config.js before rendering. Unset: the URL
#                     committed in that file ships.
#   PUBLISH_GH_PAGES  "false" skips the GitHub Pages publish (the artifact is
#                     still built).

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "schema/**"  # rendered through the wiki/_schema symlink
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "wiki/**"
      - "schema/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Render (publish on main)
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the gh-pages publish pushes a branch
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Point /ask at the chat API
        if: vars.CHAT_API_URL != ''
        env:
          CHAT_API_URL: ${{ vars.CHAT_API_URL }}
        run: |
          printf '// Generated by .github/workflows/website.yml from vars.CHAT_API_URL.\nwindow.CBIO_KB_CHAT_API_URL = %s;\n' \
            "$(python3 -c 'import json, os; print(json.dumps(os.environ["CHAT_API_URL"].strip()))')" \
            > wiki/ask-config.js
          cat wiki/ask-config.js

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: wiki

      - name: Upload rendered site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: wiki/_site
          retention-days: 14

      - name: Publish to GitHub Pages
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          vars.PUBLISH_GH_PAGES != 'false'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: wiki
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
